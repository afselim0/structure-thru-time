version: 1
num_threads: 4

# file paths
output_path: ../results/empirical/Wohns/all_2perpop_replicates
trees_dir: /project/jnovembre/afselim/structure-thru-time/data/trees/wohns_chopped/
pop_colors: ../data/metadata/wohns_pop_colors.csv
pop_labels: ../data/metadata/wohns_pop_labels.csv
