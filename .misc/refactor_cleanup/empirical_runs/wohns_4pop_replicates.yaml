version: 1
num_threads: 4

# file paths
output_path: ../results/empirical/Wohns/4pop_replicates
trees_dir: /project/jnovembre/afselim/structure-thru-time/data/trees/wohns_chopped/
pop_colors: ../data/metadata/Wohns_ancients_pop_colors.csv
pop_labels: ../data/metadata/Wohns_ancients_pop_labels.csv
num_posterior_samples: 1

# coal time pdf estimation
n_samples_per_pop: 30
max_time: 3000
n_timepoints: 1000

# rate estimation parameters
min_window_size: 75
max_window_size: 750
poly: 1

# Embeddings estimation parameters
N_min: 200
N_max: 10000000

# Plotting parameters
min_time: 50
max_rate_plot: 0.0002
embeddings_max_time: 2000
time_scale: log

pops: YRI,JPT,CHB,CEU
link_function: inverse_distance

# Replicate optimization seeds (used by compute_embeddings_replicates rule)
seeds: [0, 1,2,3,4,5,6,7]
