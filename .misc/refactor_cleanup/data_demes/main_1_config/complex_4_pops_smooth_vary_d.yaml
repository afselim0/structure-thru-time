demography: complex_4_pops
demes_file_path: ../data/demes/main_1/complex_4_pops.yaml
output_path: ../results/simulations/outputs/complex_4_pops_d/smooth
version: 1
num_threads: 12

# Simulation Parameters
num_contigs: 500
contig_length: 5000000
n_sim_per_pop: 20
mutation_rate: 1.2e-8
recombination_rate: 1.2e-8

# coal time pdf estimation
max_time: 4000
n_timepoints: 1000

# rate estimation parameters
min_window_size: 100
max_window_size: 500
compute_variance: True

# Embeddings estimation parameters
p: 1
N_min: 1000
N_max: 1000000
l1: [1e-3, 1e-3]
l2: [1e-4, 1e-4]

# Plotting parameters
min_time: 50
max_rate_plot: 0.0006
embeddings_plot_lims: 1000000
time_scale: log

# Scanning d
min_d: 2
max_d: 20
num_d: 9
