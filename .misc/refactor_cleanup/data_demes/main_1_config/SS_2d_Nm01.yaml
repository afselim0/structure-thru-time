demography: stepping_stones_2d
demes_file_path: ../data/demes/main_1/SS_2d_Nm01.yaml
version: 1
num_threads: 8

# Simulation Parameters
num_contigs: 500
contig_length: 5000000
n_sim_per_pop: 1
mutation_rate: 1.2e-8
recombination_rate: 1.2e-8

# coal time pdf estimation
max_time: 100000
n_timepoints: 2000

# rate estimation parameters
min_window_size: 200
max_window_size: 5000

# Embeddings estimation parameters
N_min: 100
N_max: 100000000
# l1: [1e-3, 1e-2]
# l2: [1e-2]

# Plotting parameters
min_time: 50
max_rate_plot: 0.001
embeddings_plot_lims: 500
time_scale: log