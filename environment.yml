# After `conda env create -f environment.yml`, run ONCE:
#     conda activate CoaSTT_env
#     bash utils/misc_utils/install_libstdcxx_hook.sh
# On older Linux (RHEL/CentOS 8, e.g. midway3) the system libstdc++ predates
# GLIBCXX_3.4.29, and the pip wheels below (highspy, cvxpy, osqp, frozenlist, vtk)
# are manylinux builds with RUNPATH=$ORIGIN only, so they load it instead of the
# modern libstdcxx-ng installed here. Whichever is imported first wins for the whole
# process, so `snakemake` then dies on `import numpy` with "GLIBCXX_3.4.29 not found"
# while a bare `import numpy` works. This cannot be fixed by a pin -- the right
# library is already installed, it is just not being found -- so the hook prepends
# $CONDA_PREFIX/lib to LD_LIBRARY_PATH at activation. Harmless on modern distros.
name: CoaSTT_env
channels:
  - conda-forge
  - bioconda        # rfmix, bcftools — keep below conda-forge (bioconda's own convention)
  - defaults
  - pip
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - plotly
  - tskit=1.0.3
  # Capped at 1.4.2 deliberately, not by accident: bcftools needs gsl <2.8 while
  # msprime >=1.4.3 needs gsl >=2.8, so the two cannot coexist. 1.4.2 is the newest
  # msprime built against gsl 2.7. Raising this pin makes the environment unsolvable
  # unless bcftools/rfmix are dropped. Simulated tree sequences are unaffected in
  # practice: the RFmix runs reuse trees produced by earlier stages.
  - msprime=1.4.2
  - stdpopsim
  - demes
  - numba
  - tqdm
  - pathos
  - scikit-image
  - pillow
  - pyyaml
  - cycler
  - zarr
  - fastparquet=2024.11.0
  - pyarrow=20.0.0
  # External binaries shelled out to by src/LocalAncestryRFmix.py (LAI_method=RFmix).
  # Both must be on PATH; the code checks for them by name and fails per tree sequence.
  - rfmix=2.03
  - bcftools=1.24
  # Human data preparation for SINGER ARG inference (data/human_data/): bedtools complements
  # the accessibility masks, samtools indexes the Ensembl ancestral FASTAs, pysam reads
  # ancestral bases per site. See data/human_data/README.md.
  - bedtools=2.31.1
  - samtools=1.21
  - pysam=0.22.1
  # Required by singer-snakemake's workflow/Snakefile (its requirements.txt); the rest of that
  # file's dependencies are already satisfied above. NB it also pins a tskit fork
  # (nspope/tskit@nsp-paircoal-partial-missing) which is deliberately NOT used here -- see
  # data/human_data/README.md for what that costs.
  - scikit-allel=1.3.13
  # Chimpanzee data preparation for SINGER ARG inference (data/chimp_data/). Unlike the human
  # prep, which starts from a curated phased release, the chimp callset is raw, unphased and
  # has no published accessibility mask, so phasing, liftover and mappability all have to be
  # done here. See data/chimp_data/README.md.
  #   beagle           statistical phasing (§3). A Java tool -- see the openjdk note below.
  #   whatshap         read-backed phasing utilities, used to validate the statistical phasing
  #   ucsc-liftover    panTro5 -> panTro6 for the EPO ancestral FASTA (§6), and
  #                    hg18 -> hg38 -> panTro6 for the Stevison recombination map (§5)
  #   genmap           reference mappability for the accessibility mask (§4); the callset is
  #                    variant-only, so a depth-based callability track is not possible
  #   ucsc-bigbedtobed reads UCSC panTro6 .bb tracks (assembly gaps, repeats) for the mask
  - beagle=5.4
  - whatshap=2.8
  - ucsc-liftover=482
  - ucsc-bigbedtobed=482
  - genmap=1.3.0
  # Pulled in by beagle, which is a Java tool. Named explicitly because the environment
  # otherwise has no JDK and the system java is 8, which Beagle 5.4 will not run on.
  - openjdk=25.0.2
  - pip
  - pip:
    - demesdraw
    - hsluv
    - kaleido
    - snakemake==9.14.5
    # Snakemake 8+ moved cluster submission out of core into executor plugins, so `--profile
    # data/human_data/config/slurm` fails with "invalid choice: 'slurm'" without this. Needed to
    # run SINGER on midway3; the local `--cores` path does not use it.
    - snakemake-executor-plugin-slurm==2.8.0
    - tsinfer==0.5.1
    - tsdate==0.2.7
    - pulp==3.3.0
    # Pinned: tszip 0.3.1 dropped the zarr v2/v3 compatibility shim (tszip/compat.py) and calls
    # `array.nbytes_stored()` as a zarr-3 method. With zarr 2.18.x -- which bio2zarr and tsinfer
    # hold us to -- that attribute is an int, so singer-snakemake's merge_chunks dies with
    # "TypeError: 'int' object is not callable". 0.3.0 keeps the shim and works with both.
    - tszip==0.3.0
    - bio2zarr[vcf]
    - imageio
    - imageio-ffmpeg
    - pyvista
    - trame
    - trame-vtk
    - trame-vuetify
    - nest_asyncio2
    - dash
    - cvxpy
