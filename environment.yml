  - defaults
  - pip
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - plotly
  - tskit=1.0.3
  - msprime
  - stdpopsim
  - demes
  - numba
  - tqdm
  - pathos
  - scikit-image
  - pillow
  - pyyaml
  - cycler
  - zarr
  - fastparquet=2024.11.0
  - pyarrow=20.0.0
  - pip
