version: 1
num_threads: 16

# file paths
output_path: /project/jnovembre/afselim/structure-thru-time/results/outputs/chimps/admix
trees_dir: /project/jnovembre/afselim/structure-thru-time/data/chimp_data/results/chimp/ts_chunks/draw_19
pop_colors: ../data/chimp_data/resources/samples/pop_colors.csv
pop_labels: ../data/chimp_data/resources/samples/pop_labels.csv

# Admix populations
admixed_pops: [NC, "W x C"]

# Reference panels, built to be size-matched: 5 Eastern + 5 Central individuals
# against 10 Western, i.e. 20 haplotypes each. Counts are DIPLOID INDIVIDUALS;
# both haplotypes of each chosen individual enter the panel, and "first n" means
# lowest individual_id (deterministic, no seed).
reference_pops:
  EasternCentral:
    Eastern: 5
    Central: 5
  West:
    Western: 10

LAI_method: GNN


# coal time pdf estimation
pdf_min_time: 0
pdf_max_time: 50000
pdf_bin_size: 50

# rate estimation parameters
rates_min_time: 400
rates_max_time: 40000
min_window_size: 500
max_window_size: 2000

# Embeddings estimation parameters
link_function: inverse_distance
N_min: 100
N_max: 10000000
l1: [0.0001,0.001]
# n_timepoints_emb: 1000

# Plotting parameters
max_rate_plot: 0.0001
max_Ne_plot: 120000
Ne_plot_scale: linear
generation_time: 25
time_scale: log

