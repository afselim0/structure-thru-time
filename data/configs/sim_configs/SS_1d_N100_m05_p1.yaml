pdf_min_time: 0
pdf_max_time: 200000
pdf_bin_size: 50

# rate estimation parameters
min_window_size: 100
max_window_size: 10000

# Embeddings estimation parameters
N_min: 1
N_max: 100000000
p: 1

# Plotting parameters
embeddings_min_time: 50
max_rate_plot: 0.001
embeddings_plot_lims: 2000000
time_scale: log
