demography: SS_1d_N100_m05
demes_file_path: ../data/demes/SS_1d_N100_m05.yaml
output_path: ../results/outputs/simulations/SS/SS_1d_N100_m05/sim
version: 1
num_threads: 8

# Simulation Parameters
num_contigs: 500
contig_length: 5000000
n_sim_per_pop: 1
