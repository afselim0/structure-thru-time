demography: sawtooth
demes_file_path: ../data/demes/sawtooth.yaml
output_path: ../results/outputs/simulations/sawtooth/sim
version: 1
num_threads: 12

# Simulation Parameters
num_contigs: 500
contig_length: 5000000
n_sim_per_pop: 20
mutation_rate: 1.2e-8
recombination_rate: 1.2e-8

# coal time pdf estimation
pdf_min_time: 0
pdf_max_time: 51000
pdf_bin_size: 20

# rate estimation parameters
rates_min_time: 40
rates_max_time: 50000
min_window_size: 60
max_window_size: 2000

# Embeddings estimation parameters
N_min: 1000
N_max: 1000000
l1: [0.0001,0.001]

# Plotting parameters
max_rate_plot: 0.0005
embeddings_plot_lims: 500000
time_scale: log
