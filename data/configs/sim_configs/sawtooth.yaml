demography: split_sawtooth
demes_file_path: ../data/demes/split_sawtooth.yaml
output_path: ../results/outputs/simulations/sawtooth/sim
version: 1
num_threads: 12

# Simulation Parameters
num_contigs: 500
contig_length: 5000000
n_sim_per_pop: 20
mutation_rate: 1.2e-8
recombination_rate: 1.2e-8

# coal time pdf estimation
max_time: 50000
n_timepoints: 5000

# rate estimation parameters
min_window_size: 80
max_window_size: 1500
compute_variance: True

# Embeddings estimation parameters
p: 1
N_min: 1000
N_max: 1000000
# l1: [1e-3, 1e-2]
# l2: [1e-2]

# Plotting parameters
min_time: 40
max_rate_plot: 0.0005
embeddings_plot_lims: 1000
time_scale: log
