demography: recent_bottleneck
demes_file_path: ../data/demes/recent_bottleneck.yaml
output_path: ../results/outputs/simulations/admix/recent_bottleneck/sim
version: 1
num_threads: 12

admixed_pops: [A]
# Local ancestry method: RFmix (default), GNN, or True (ground-truth calls from
# the simulation; simulated data only)
# No admixed deme in this demography (the ADMIXTURE-like signal comes from a
# bottleneck, not admixture), so ground-truth local ancestry is undefined here.
LAI_method: RFmix

# Simulation Parameters
num_contigs: 500
contig_length: 5000000
n_sim_per_pop: 5
mutation_rate: 1.2e-8
recombination_rate: 1.2e-8

# coal time pdf estimation
max_time: 5000
n_timepoints: 2500
# fraction_samples: 1.0

# rate estimation parameters
min_window_size: 20
max_window_size: 300

# Embeddings estimation parameters
N_min: 100
N_max: 1000000
p: 1
# l1: [0,0.05]

# Plotting parameters
min_time: 10
max_rate_plot: 0.0002
embeddings_plot_lims: 1000000
time_scale: log
