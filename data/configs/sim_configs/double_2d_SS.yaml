demography: double_2d_SS
demes_file_path: ../data/demes/double_2d_SS.yaml
output_path: ../results/outputs/simulations/double_2d_SS/sim
version: 1
num_threads: 12

# Simulation Parameters
num_contigs: 500
contig_length: 5000000
n_sim_per_pop: 1
mutation_rate: 1.2e-8
recombination_rate: 1.2e-8

# coal time pdf estimation
pdf_min_time: 0
pdf_max_time: 6500
pdf_bin_size: 10

# rate estimation parameters
rates_min_time: 50
rates_max_time: 6000
min_window_size: 50
max_window_size: 500

# Embeddings estimation parameters
N_min: 1
N_max: 10000000
p: 2
l1: [0.0001,0.001]

# Plotting parameters
max_rate_plot: 0.001
embeddings_plot_lims: 1000
time_scale: log