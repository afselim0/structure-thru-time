demography: SS_2d_N100_m01
demes_file_path: ../data/demes/SS_demes/SS_2d_N100_m01.yaml
output_path: ../results/simulations/outputs/SS/SS_2d_N100_m01
version: 1
num_threads: 8

# Simulation Parameters
num_contigs: 500
contig_length: 5000000
n_sim_per_pop: 1
mutation_rate: 1.2e-8
recombination_rate: 1.2e-8

# coal time pdf estimation
max_time: 20000
n_timepoints: 2000

# rate estimation parameters
min_window_size: 50
max_window_size: 1000
compute_variance: True

# Embeddings estimation parameters
N_min: 1
N_max: 100000000
p: 2

# Plotting parameters
min_time: 25
max_rate_plot: 0.001
embeddings_plot_lims: 1000
time_scale: log