demography: SS_N100_m_001
demes_file_path: ../data/demes/main_1/SS_N100_m_001.yaml
version: 1
num_threads: 8

# Simulation Parameters
num_contigs: 500
contig_length: 5000000
n_sim_per_pop: 1
mutation_rate: 1.2e-8
recombination_rate: 1.2e-8

# coal time pdf estimation
max_time: 100000
n_timepoints: 5000

# rate estimation parameters
min_window_size: 100
max_window_size: 200

# Embeddings estimation parameters
N_min: 1000
N_max: 1000000000000
# l1: [1e-3, 1e-2]
# l2: [1e-2]

# Plotting parameters
min_time: 50
max_rate_plot: 0.001
embeddings_plot_lims: 2000
time_scale: log