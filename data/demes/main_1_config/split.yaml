demography: split
demes_file_path: ../data/demes/main_1/split.yaml
version: 1
num_threads: 12

# Simulation Parameters
num_contigs: 500
contig_length: 5000000
n_sim_per_pop: 20
mutation_rate: 1.2e-8
recombination_rate: 1.2e-8

# coal time pdf estimation
max_time: 10000
n_timepoints: 2000
# fraction_samples: 1.0

# rate estimation parameters
min_window_size: 100
max_window_size: 200
poly: 1

# Embeddings estimation parameters
N_min: 100
N_max: 1000000
# l1: [1e-3, 1e-2]
# l2: [1e-2]

# Plotting parameters
min_time: 50
max_rate_plot: 0.0002
embeddings_plot_lims: 1000
time_scale: linear
