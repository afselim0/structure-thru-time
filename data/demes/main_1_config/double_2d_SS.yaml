demography: double_2d_SS
demes_file_path: ../data/demes/main_1/double_2d_SS.yaml
output_path: ../results/simulations/outputs/double_2d_SS
version: 1
num_threads: 8

# Simulation Parameters
num_contigs: 500
contig_length: 5000000
n_sim_per_pop: 1
mutation_rate: 1.2e-8
recombination_rate: 1.2e-8

# coal time pdf estimation
max_time: 5000
n_timepoints: 1000

# rate estimation parameters
min_window_size: 50
max_window_size: 200
compute_variance: True

# Embeddings estimation parameters
N_min: 1
N_max: 100000000
p: 2
l1: [1e-2, 1e-3]
l2: [1e-3, 1e-4]

# Plotting parameters
min_time: 50
max_rate_plot: 0.001
embeddings_plot_lims: 1000
time_scale: log