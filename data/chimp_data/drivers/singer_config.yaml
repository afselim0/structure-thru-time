# singer-snakemake configuration for the chimpanzee panel.
#
# NOT YET TUNED below the input/rate block: chunking and MCMC lengths are at the upstream
# example's defaults and want revisiting against the chr21 pilot run.
#
# Run from the singer-snakemake clone:
#   cd ../singer-snakemake
#   snakemake --configfile ../chimp_data/singer_config.yaml --cores all

input-dir: "../chimp_data/SingerSnakemake_Input"
output-dir: "../chimp_data/results/chimp/singer-snakemake_outputs"
chromosomes: null           # null => glob every {chrom}.vcf.gz in input-dir

# Chimpanzee trio-derived, NOT the human 1.25e-8 default. Venn et al. 2014 (Science) put the
# Pan troglodytes per-generation rate at 1.2e-8 from a pedigree of captive chimpanzees, which
# is the directly measured value for this species rather than one carried over from human.
# Generation time ~24-25 yr for any calendar conversion downstream.
mutation-rate: 1.2e-8
recombination-rate: 1.0e-8  # ignored: a per-chromosome hapmap is supplied

# Ancestral state.
#
# `polarised` is IGNORED whenever a <chrom>.ancestral.fa.gz is present, which it always is
# here -- chunk_chromosomes.py only consults the flag when that file is absent. Set false for
# clarity about what the data are, not because it takes effect.
polarised: false

# Keeps sites whose ancestral state is unknown (N in the projected human sequence, 2.02% of
# chr21) rather than discarding them; they are handed to SINGER's own per-site polarisation.
# Only has any effect when `polarised` is ALSO true, so this is belt and braces.
remove-unpolarised: false

# One stratum per subspecies. NB the panel contains a single verus x troglodytes hybrid
# (SAMN01920541), which therefore forms a ONE-SAMPLE stratum -- see README.
stratify-by: "subspecies"

random-seed: 1

# --- discretization options ---
#
# 2 Mb chunks, matching the human prep. SINGER's cost is roughly linear in chunk LENGTH, in
# both memory and time, and at 3 Mb the measured peak was 4.00 GB (n=2,580 completed chunks)
# against a jnovembre core's 3.93 GB share -- the worst case slightly EXCEEDED its budget, so
# a node running 64 chunks at once had no margin. Halving the chunk roughly halves the peak.
#
# It also compresses the runtime tail, which is what actually sets the makespan. Measured at
# 3 Mb: p50 0.94 h but p90 9.95 h and max 19.81 h, and the slowest 10% of chunks consumed 46%
# of all CPU-hours. A node's job finishes when its SLOWEST chunk does, not its average, so
# shortening that tail matters more than the median.
#
# Cost: ~897 chunks becomes ~1,800, and more chunk boundaries for merge_chunks to stitch
# across. `min-sites: 1000` is also marginally harder to clear in a shorter chunk, so expect a
# few more skipped at chromosome ends.
max-chunk-size: 2.0e6
min-chunk-size: 0.5e6
min-gap-size: 1.0e6
max-missing: 0.5
min-sites: 1000
min-branch-length: 1.0e-7
max-masked-samples: 0

# --- SINGER options ---
#
# 5,000 MCMC iterations: thin 250 x 20 samples. SINGER's supplementary figure 10 puts the
# burn-in requirement at roughly 4,000 iterations, so the draw CoaSTT consumes -- the last one,
# at iteration 5,000 -- is comfortably past it.
#
# WHY 20 DRAWS AT THIN 250, NOT 100 AT THIN 50. Both give 5,000 iterations, and
# extract_ts_chunks.py feeds CoaSTT the HIGHEST draw either way, which sits at iteration 5,000
# in both. The difference is everything downstream of SINGER, because POLEGON runs once per
# (chunk, draw) and merge_chunks once per (chromosome, draw). For this panel's 897 chunks:
#
#                          n=100/thin50     n=20/thin250
#     POLEGON jobs            89,700           17,940
#     merge jobs               2,300              460
#     snakemake DAG           ~99,900 steps    ~20,000 steps
#
# The DAG size is not academic here: at n=100 the driver was OOM-KILLED building the DAG on a
# midway3 login node (8 GiB cgroup), which is what stranded the first genome-wide run -- its
# SLURM jobs kept going with nothing left to schedule them. Fewer draws is the fix that
# addresses the cause rather than the symptom.
#
# Draw spacing is also better: 250 iterations apart rather than 50, so retained draws are far
# less autocorrelated. And nothing is wasted -- at n=100 with burnin 0.8, POLEGON dated 80
# draws that were then deleted.
#
# `singer-mcmc-burnin: 0.6` drops the first 12 draws, so statistics and diagnostic plots are
# built from draws 12-19 -- iterations 3,250 to 5,000, the converged end of the chain.
#
# Note the burn-in fraction affects ONLY those statistics and plots (Snakefile:426,480).
# merge_chunks writes a tree sequence for every draw regardless, so nothing in the workflow
# stops a pre-convergence draw reaching CoaSTT. extract_ts_chunks.py enforces that separately,
# and on chain POSITION rather than draw index: it keeps draws at iteration >= 4,000, i.e.
# draw 15 onward here, and reads draw 19 (iteration 5,000).
#
# Read the two iteration counters in a SINGER log carefully, they mean different things:
#   * the FIRST `Iteration: N` sequence counts ARG CONSTRUCTION, threading in one haplotype at
#     a time. It runs to (2 x samples - 1) -- 107 for this panel's 54 diploids -- and is fixed
#     by sample size, not by any MCMC setting. It is not burn-in.
#   * the SECOND sequence, restarting at `Iteration: 0` after `rescaled ARG length`, is one
#     entry per RETAINED DRAW. That is the MCMC.
#
# Measured on this panel at 5,000 iterations, n=7,255 completed chunks:
#     p50 1.3 h | p90 11.5 h | p99 18.3 h per chunk
singer-mcmc-samples: 20
singer-mcmc-thin: 250
singer-mcmc-burnin: 0.6
singer-mcmc-resumes: 1000
singer-skip-failures: true

# --- POLEGON options ---
polegon-mcmc-samples: 20
polegon-mcmc-thin: 250
polegon-mcmc-burnin: 0.6
polegon-scaling-reps: 5
polegon-max-step: 10.0

# --- summary statistics ---
stats-time-grid: [1, 7, 25]
stats-window-size: 5.0e4
paircoal-reweight: false
