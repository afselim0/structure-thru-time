# Shared singer-snakemake configuration for every HGDP run in data/human_data/.
#     input-dir       which sample set
#     output-dir      where its results go
#     chromosomes     which chromosomes (null = all present in input-dir)
#
# Those three are supplied on the command line with --config, NOT by copying this file.
# scripts/run_singer.sh does it like this:
#
#     snakemake --configfile drivers/singer_config.yaml \
#               --config input-dir=... output-dir=... chromosomes='["chr22"]' \
#               --directory <scratch workdir> --profile <staged cluster config>
#
# snakemake applies --config after --configfile, so the overrides win. Change a rate, a chunk
# size or an MCMC length HERE and every subsequent run picks it up; there is no second copy to
# keep in sync.
#
# Two documented exceptions, both applied by scripts/run_singer.sh rather than by a second file:
#   * ALL is stratified by `region` (see the stratify-by block below).
#   * --pilot cuts the number of MCMC samples, to exercise the pipeline quickly. It keeps the
#     thinning interval below, so a pilot draw is drawn from the same chain behaviour as a
#     production one -- there are simply fewer of them.
#
# Chunking and MCMC lengths below are set from measured pilot runs (2 Mb chunks, 1600 MCMC
# iterations = 16 samples x thin 100); the per-rule memory and walltime that follow from them
# live in drivers/slurm_*.config.

# --- run identity: overridden per run, values here are only a usable default ---
input-dir: "SingerSnakemake_SampleSets/OCEANIA"
output-dir: "results/OCEANIA/singer-snakemake_outputs"
chromosomes: null           # null => glob every {chrom}.vcf.gz in input-dir

# --- everything below is shared by every run ---

mutation-rate: 1.25e-8      # per base per generation
recombination-rate: 1.0e-8  # ignored: a per-chromosome hapmap is supplied

# Ancestral state.
# `polarised` is IGNORED whenever a <chrom>.ancestral.fa.gz is present, which it always is
# here -- chunk_chromosomes.py only consults the flag when that file is absent. It is set
# false for clarity about what the data are, not because it takes effect.
polarised: false

# `remove-unpolarised` is undocumented (absent from the upstream example config, read via
# config.get with a False default). Keeping it false is what retains sites whose ancestral
# state is unknown -- they are handed to SINGER's own per-site polarisation instead of being
# discarded. Note it only has any effect when `polarised` is ALSO true, so this is belt and
# braces against a future change to that default.
remove-unpolarised: false

# Column in <chrom>.meta.csv used for the population table and for every stratified statistic.
#
# `population` is right for the seven regional sets, which each cover one region and where the
# populations within it are the structure of interest.
#
# ALL is the documented exception and scripts/run_singer.sh overrides it to `region`: ALL is 4 samples
# from each of 54 populations, so stratifying by population would give 1,485 cross-coalescence
# pairs each backed by only 8 haplotypes. The 7 regions give 28 pairs with real support.
stratify-by: "population"

random-seed: 1

# --- discretization options ---
max-chunk-size: 2.0e6
min-chunk-size: 0.5e6
min-gap-size: 1.0e6
max-missing: 0.75
min-sites: 1500
min-branch-length: 1.0e-7

# --- missing-genotype imputation (see README.md "No blanket drop of missing genotypes") ---
#
# All four keys are UNDOCUMENTED: none appears in the upstream example config, and each is read
# via `config.get(key, default)` in the Snakefile. They are set explicitly here because three of
# the four defaults are wrong for us and one of them is actively dangerous.
#
# max-masked-samples is very important! chunk_chromosomes.py:220 does
#   samplemask_inaccessible = samplemask_intervals[samplemask_coverage > max_masked_samples]
#   for (a, b) in samplemask_inaccessible: bitmask[a:b] = True     # True == INACCESSIBLE
# so at its default of 0, ANY position covered by even one masked sample is marked globally
# inaccessible -- silently deleting the very sites the mask exists to rescue. It must exceed the
# largest per-site masked-sample count in any chr{N}.sample.mask.bed. make_sample_masks.py prints
# that maximum, verify_sets.py asserts on it, and scripts/test_max_masked_samples.py proves both
# branches. Our threshold caps it at 10% of samples (<= 23 for the largest set), so 999 is safe
# for every set.
max-masked-samples: 999
impute-sample-masks: true      # fill masked genotypes by binomial draw from observed frequency
delete-imputed-intervals: true # clip imputed ancestry back out of the output tree sequence
skip-node-masks: false         # keep imputed spans out of POLEGON dating

# --- SINGER options ---
singer-mcmc-samples: 16
singer-mcmc-thin: 100
singer-mcmc-burnin: 0.5
singer-mcmc-resumes: 1000
singer-skip-failures: true

# --- POLEGON options ---
polegon-mcmc-samples: 16
polegon-mcmc-thin: 100
polegon-mcmc-burnin: 0.5
polegon-scaling-reps: 5
polegon-max-step: 10.0

# --- summary statistics ---
stats-time-grid: [1, 7, 25]
stats-window-size: 5.0e4
paircoal-reweight: false
