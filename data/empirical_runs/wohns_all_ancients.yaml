version: 1
num_threads: 4

# file paths
output_path: ../results/empirical/Wohns/all_ancients.npp.2
trees_dir: ../data/trees/wohns_chopped
pop_colors: ../data/metadata/wohns_ancients_pop_colors.csv
pop_labels: ../data/metadata/wohns_ancients_pop_labels.csv
num_posterior_samples: 1

# coal time pdf estimation
n_samples_per_pop: 2
max_time: 10000
n_timepoints: 5000

# rate estimation parameters
min_window_size: 100
max_window_size: 4000
