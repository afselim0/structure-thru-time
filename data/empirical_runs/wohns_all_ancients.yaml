# Embeddings estimation parameters
N_min: 1000
N_max: 10000000
# l1: [1e-3, 1e-2]
# l2: [1e-2]

# Plotting parameters
min_time: 20
max_rate_plot: 0.0002
embeddings_plot_lims: 8000
time_scale: log